<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Create. Govern. Publish.</title><desc id="desc">Three connected Myoxus capabilities built on a mature Rust server. Open source, centrally managed, and designed to scale from self-hosting to a private cloud.</desc><defs><linearGradient id="foundation" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#183a50"/><stop offset="1" stop-color="#244e60"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.number{fill:#54798b;font-size:15px;letter-spacing:2px;font-weight:700}.heading{fill:#173a50;font-size:34px;font-weight:700}.tag{fill:#416371;font-size:16px}.body{fill:#244653;font-size:16px}.base{fill:#fff;font-size:23px;font-weight:700}.foot{fill:#d7e9f0;font-size:16px}</style><rect x="0" y="0" width="1200" height="390" rx="18" fill="#f5f8fa"/><rect x="32" y="28" width="356" height="252" rx="12" fill="#fff" stroke="#d7e3e8"/><text x="56" y="61" class="number"><tspan x="56" dy="0">01</tspan></text><text x="56" y="104" class="heading"><tspan x="56" dy="0">Create</tspan></text><text x="56" y="134" class="tag"><tspan x="56" dy="0">Ideas into shared knowledge</tspan></text><path d="M56 158 h308" stroke="#e1e9ed"/><text x="56" y="189" class="body"><tspan x="56" dy="0">Rich documents &amp; visual canvas</tspan><tspan x="56" dy="25">Databases, views &amp; project work</tspan><tspan x="56" dy="25">Live collaboration, comments &amp; history</tspan></text><rect x="422" y="28" width="356" height="252" rx="12" fill="#fff" stroke="#d7e3e8"/><text x="446" y="61" class="number"><tspan x="446" dy="0">02</tspan></text><text x="446" y="104" class="heading"><tspan x="446" dy="0">Govern</tspan></text><text x="446" y="134" class="tag"><tspan x="446" dy="0">Standards across your organization</tspan></text><path d="M446 158 h308" stroke="#e1e9ed"/><text x="446" y="189" class="body"><tspan x="446" dy="0">Central templates &amp; workspace roles</tspan><tspan x="446" dy="25">Shared branding, typography &amp; fonts</tspan><tspan x="446" dy="25">Server-owned rules &amp; automation</tspan></text><rect x="812" y="28" width="356" height="252" rx="12" fill="#fff" stroke="#d7e3e8"/><text x="836" y="61" class="number"><tspan x="836" dy="0">03</tspan></text><text x="836" y="104" class="heading"><tspan x="836" dy="0">Publish</tspan></text><text x="836" y="134" class="tag"><tspan x="836" dy="0">Knowledge beyond the workspace</tspan></text><path d="M836 158 h308" stroke="#e1e9ed"/><text x="836" y="189" class="body"><tspan x="836" dy="0">Public HTML pages &amp; portable exports</tspan><tspan x="836" dy="25">Typst PDFs, reports &amp; presentations</tspan><tspan x="836" dy="25">Markdown &amp; vault interchange</tspan></text><rect x="32" y="301" width="1136" height="65" rx="12" fill="url(#foundation)"/><text x="56" y="329" class="base"><tspan x="56" dy="0">One mature Rust foundation</tspan></text><text x="56" y="353" class="foot"><tspan x="56" dy="0">Open source. Centrally managed. Designed to scale.</tspan></text><text x="1144" y="338" text-anchor="end" class="foot">Self-hosted → Linux VMs → Private cloud</text></svg>
