<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Personal knowledge and shared workspaces</title>
  <desc id="desc">Every user has a personal workspace, private by default, alongside shared workspaces for departments, projects and cross-team topics. Each workspace has its own content and membership context on the same managed Myoxus server.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#125951"/><stop offset="1" stop-color="#23766c"/></linearGradient>
  </defs>
  <rect width="1200" height="390" rx="20" fill="#f3f7f6"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="48" font-size="27" font-weight="700" fill="#173c36">A personal home. The right shared contexts.</text>
    <text x="36" y="80" font-size="18" fill="#526b65">Move between your own knowledge and the work you share with others.</text>
    <g fill="#fff" stroke="#cdded9">
      <rect x="36" y="108" width="264" height="176" rx="12"/>
      <rect x="324" y="108" width="264" height="176" rx="12"/>
      <rect x="612" y="108" width="264" height="176" rx="12"/>
      <rect x="900" y="108" width="264" height="176" rx="12"/>
    </g>
    <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#297d6c">
      <text x="58" y="141">PERSONAL</text><text x="346" y="141">DEPARTMENT</text>
      <text x="634" y="141">PROJECT</text><text x="922" y="141">CROSS-TEAM TOPIC</text>
    </g>
    <g font-size="24" font-weight="700" fill="#173c36">
      <text x="58" y="181">Your workspace</text><text x="346" y="181">Operations</text>
      <text x="634" y="181">Project Aurora</text><text x="922" y="181">Architecture</text>
    </g>
    <g font-size="18" fill="#526b65">
      <text x="58" y="216">Notes, ideas and drafts</text><text x="58" y="244">Private by default</text>
      <text x="346" y="216">Runbooks and catalogues</text><text x="346" y="244">Shared with the team</text>
      <text x="634" y="216">Plans and decisions</text><text x="634" y="244">Shared with contributors</text>
      <text x="922" y="216">Standards and research</text><text x="922" y="244">Shared across teams</text>
    </g>
    <rect x="36" y="310" width="1128" height="54" rx="12" fill="url(#base)"/>
    <text x="600" y="343" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Documents · Databases · Templates · Memberships and roles</text>
  </g>
</svg>
