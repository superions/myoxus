<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Two clients, one managed foundation</title>
  <desc id="desc">Browser Web accesses server workspaces directly. The Electron rich client adds desktop integration and limited local or cached offline document work. Both connect to the same Rust server for shared access, databases, templates, publishing and integrations.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#125951"/><stop offset="1" stop-color="#23766c"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7ca79a"/></marker>
  </defs>
  <rect width="1200" height="430" rx="20" fill="#f3f7f6"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="48" font-size="27" font-weight="700" fill="#173c36">Two clients. One managed foundation.</text>
    <g fill="#fff" stroke="#cdded9">
      <rect x="36" y="82" width="546" height="176" rx="12"/>
      <rect x="618" y="82" width="546" height="176" rx="12"/>
    </g>
    <g font-size="13" font-weight="700" letter-spacing="1.5" fill="#297d6c">
      <text x="60" y="117">BROWSER WEB</text><text x="642" y="117">ELECTRON RICH CLIENT</text>
    </g>
    <g font-size="24" font-weight="700" fill="#173c36">
      <text x="60" y="155">Open your shared workspace</text>
      <text x="642" y="155">Bring it to your desktop</text>
    </g>
    <g font-size="18" fill="#526b65">
      <text x="60" y="191">Direct access · Operator-served updates</text>
      <text x="60" y="225">Server workspaces · Connection required</text>
      <text x="642" y="191">Native windows, menus, dialogs and storage</text>
      <text x="642" y="225">Limited offline work with local/cached content</text>
    </g>
    <g stroke="#7ca79a" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M309 264V302"/><path d="M891 264V302"/>
    </g>
    <rect x="36" y="310" width="1128" height="92" rx="12" fill="url(#base)"/>
    <text x="600" y="344" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Mature Rust server · Central administration</text>
    <text x="600" y="377" text-anchor="middle" font-size="18" fill="#e4f1ec">Shared access · Databases · Templates · HTML and Typst PDF · Integrations</text>
  </g>
</svg>
