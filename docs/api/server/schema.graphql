  """
  credentialInherited: Boolean!
  cronExpression: String
  cronMisfirePolicy: GitSyncCronMisfirePolicy
  cronNextScheduledAt: DateTime
  cronPendingMisfireScheduledFor: DateTime
  cronTimezone: String
  enabled: Boolean!
  id: ID!
  manifestPath: String!
  """
  Per-workspace mirror storage limit in MB (null = use global limit).
  """
  maxMirrorStorageMb: Int
  pollingIntervalSecs: Int
  repoUrl: String!
  rootPath: String!
  syncDirection: GitSyncDirection!
  triggerMode: GitSyncTriggerMode!
  updatedAt: DateTime!
}

