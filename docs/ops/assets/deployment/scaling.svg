<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Myoxus scaling from self-hosting to a private cloud</title><desc id="desc">Three deployment stages lead from one host through Linux VMs to several API containers. A load balancer routes to API instances sharing PostgreSQL, Redis, object storage and PDF fonts. Database and Redis failover are platform-owned.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b40}.heading{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#496277}.label{font-size:18px}.small{font-size:16px;fill:#496277}.box{fill:#f0f6fc;stroke:#49759e;stroke-width:1.5}.data{fill:#fff;stroke:#49759e;stroke-width:1.5}.tier{fill:#f5f7fa;stroke:#d0d9e2}.arrow{fill:none;stroke:#617e98;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#617e98"/></marker></defs><rect width="1200" height="960" fill="#fff"/><text x="600" y="40" class="heading" text-anchor="middle"><tspan x="600" dy="0">One architecture. Room to grow.</tspan></text><text x="600" y="69" class="sub" text-anchor="middle"><tspan x="600" dy="0">Self-hosted systems, Linux VMs and an operator-managed private cloud</tspan></text><rect x="40" y="98" width="330" height="98" rx="10" class="box"/><text x="205" y="141" class="label" text-anchor="middle"><tspan x="205" dy="0">1 · Single host</tspan><tspan x="205" dy="23">API + frontend + local services</tspan></text><rect x="435" y="98" width="330" height="98" rx="10" class="box"/><text x="600" y="141" class="label" text-anchor="middle"><tspan x="600" dy="0">2 · Linux VM infrastructure</tspan><tspan x="600" dy="23">Separate application / data tiers</tspan></text><rect x="830" y="98" width="330" height="98" rx="10" class="box"/><text x="995" y="141" class="label" text-anchor="middle"><tspan x="995" dy="0">3 · Private cloud</tspan><tspan x="995" dy="23">Multiple API containers + shared state</tspan></text><path d="M375 147 L426 147" class="arrow"/><path d="M770 147 L821 147" class="arrow"/><text x="600" y="229" class="heading" text-anchor="middle"><tspan x="600" dy="0">Private-cloud reference topology</tspan></text><rect x="385" y="256" width="430" height="58" rx="10" class="box"/><text x="600" y="290.5" class="label" text-anchor="middle"><tspan x="600" dy="0">Browser Web / Electron clients</tspan></text><path d="M600 314 L600 340" class="arrow"/><rect x="270" y="340" width="660" height="64" rx="10" class="box"/><text x="600" y="366" class="label" text-anchor="middle"><tspan x="600" dy="0">TLS edge + Web / Admin frontend delivery</tspan><tspan x="600" dy="23">Load balancing for HTTP / GraphQL / WebSocket</tspan></text><rect x="40" y="435" width="1120" height="145" rx="12" class="tier"/><text x="600" y="463" class="sub" text-anchor="middle"><tspan x="600" dy="0">Application tier · containers across hosts / Linux VMs</tspan></text><rect x="80" y="482" width="300" height="74" rx="10" class="box"/><text x="230" y="513" class="label" text-anchor="middle"><tspan x="230" dy="0">Myoxus API A</tspan><tspan x="230" dy="23">Embedded workers + scheduler</tspan></text><rect x="450" y="482" width="300" height="74" rx="10" class="box"/><text x="600" y="513" class="label" text-anchor="middle"><tspan x="600" dy="0">Myoxus API B</tspan><tspan x="600" dy="23">Embedded workers + scheduler</tspan></text><rect x="820" y="482" width="300" height="74" rx="10" class="box"/><text x="970" y="513" class="label" text-anchor="middle"><tspan x="970" dy="0">Myoxus API N</tspan><tspan x="970" dy="23">Embedded workers + scheduler</tspan></text><path d="M600 404 V420 H230 V482 M600 420 V441 M600 477 V482 M600 420 H970 V482" class="arrow"/><path d="M230 556 V609 H970 V556 M600 556 V609" fill="none" stroke="#617e98" stroke-width="2"/><path d="M600 609 L600 636" class="arrow"/><rect x="40" y="636" width="1120" height="194" rx="12" class="tier"/><text x="600" y="667" class="sub" text-anchor="middle"><tspan x="600" dy="0">Shared services · identical endpoints / namespaces for every API</tspan></text><rect x="65" y="689" width="245" height="114" rx="10" class="data"/><text x="187.5" y="728.5" class="label" text-anchor="middle"><tspan x="187.5" dy="0">PostgreSQL service</tspan><tspan x="187.5" dy="23">One logical database</tspan><tspan x="187.5" dy="23">One writable authority</tspan></text><rect x="340" y="689" width="245" height="114" rx="10" class="data"/><text x="462.5" y="728.5" class="label" text-anchor="middle"><tspan x="462.5" dy="0">Redis role services</tspan><tspan x="462.5" dy="23">Sessions / queues / locks</tspan><tspan x="462.5" dy="23">Cache / realtime</tspan></text><rect x="615" y="689" width="245" height="114" rx="10" class="data"/><text x="737.5" y="728.5" class="label" text-anchor="middle"><tspan x="737.5" dy="0">Object storage</tspan><tspan x="737.5" dy="23">Shared bucket / prefix</tspan><tspan x="737.5" dy="23">Blobs and attachments</tspan></text><rect x="890" y="689" width="245" height="114" rx="10" class="data"/><text x="1012.5" y="728.5" class="label" text-anchor="middle"><tspan x="1012.5" dy="0">PDF font backend</tspan><tspan x="1012.5" dy="23">Shared rendering assets</tspan><tspan x="1012.5" dy="23">Available to every API</tspan></text><text x="600" y="860" class="small" text-anchor="middle"><tspan x="600" dy="0">Database / Redis HA and failover are platform-owned and require verification.</tspan></text><text x="600" y="887" class="small" text-anchor="middle"><tspan x="600" dy="0">Capacity scaling does not by itself guarantee high availability.</tspan></text><rect x="250" y="907" width="700" height="36" rx="10" class="data"/><text x="600" y="930.5" class="label" text-anchor="middle"><tspan x="600" dy="0">Coordinated PostgreSQL + blob + font backups</tspan></text></svg>
