config:
  strict: false
  maybeValue: T | null
  declarationKind: interface
  avoidOptionals:
    field: true
    inputValue: false
    object: false
    defaultValue: false
  preResolveTypes: true
  namingConvention:
    enumValues: keep
  scalars:
    DateTime: string
    Date: string
    Decimal: number
    UUID: string
    ID: string
    JSON: any
    Upload: File
    SafeInt: number
overwrite: true
schema:
  - http://localhost:3001/graphql:
      loader: ./schema-loader.cjs
documents: ./src/**/*.gql
generates:
  ./src/schema.ts:
    plugins:
      - typescript
  ./src/operations.ts:
    config:
      importSchemaTypesFrom: ./src/schema
      namespacedImportName: Types
    plugins:
      - typescript-operations
      - ./export-gql-plugin.cjs:
          output: ./src/graphql/index.ts
