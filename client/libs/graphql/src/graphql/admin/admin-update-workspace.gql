mutation adminUpdateWorkspace($input: AdminUpdateWorkspaceInput!) {
  admin {
    adminUpdateWorkspace(input: $input) {
      id
      public
      createdAt
      name
      avatarKey
      enableAi
      enableSharing
      enableUrlPreview
      enableDocEmbedding
      features
      owner {
        id
        name
        email
        avatarUrl
      }
      memberCount
      publicPageCount
      snapshotCount
      snapshotSize
      blobCount
      blobSize
      storageQuotaBytes
      storageQuotaUsed
    }
  }
}
