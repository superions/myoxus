query adminAppServerBranding {
  admin {
    appServerBranding {
      logo {
        id
        slot
        variant
        qualityClass
        storageKind
        storageKey
        publicUrl
        mime
        sha256
        byteSize
        widthPx
        heightPx
      }
      productMark {
        id
        slot
        variant
        qualityClass
        storageKind
        storageKey
        publicUrl
        mime
        sha256
        byteSize
        widthPx
        heightPx
      }
      faviconPack {
        id
        slot
        variant
        qualityClass
        storageKind
        storageKey
        publicUrl
        mime
        sha256
        byteSize
        widthPx
        heightPx
      }
    }
  }
}

query adminOrganizationIdentity {
  admin {
    organizationIdentity {
      displayName
      legalName
      shortName
      jurisdiction
      websiteUrl
      contactEmail
      addressLines
      taxId
      registrationId
    }
  }
}

mutation adminUpdateOrganizationIdentity($input: UpdateOrganizationIdentityInput!) {
  admin {
    updateOrganizationIdentity(input: $input) {
      displayName
      legalName
      shortName
      jurisdiction
      websiteUrl
      contactEmail
      addressLines
      taxId
      registrationId
    }
  }
}

mutation adminUpdateAppServerBranding($input: UpdateAppServerBrandingInput!) {
