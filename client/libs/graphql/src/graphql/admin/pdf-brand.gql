mutation adminUpdatePdfExportSettings(
  $workspaceId: ID!
  $paperSize: String
  $locale: String
  $colorProfile: String
  $imageQuality: String
  $ligaturesEnabled: Boolean
) {
  admin {
    updatePdfExportSettings(
      workspaceId: $workspaceId
      paperSize: $paperSize
      locale: $locale
      colorProfile: $colorProfile
      imageQuality: $imageQuality
      ligaturesEnabled: $ligaturesEnabled
    ) {
      workspaceId
      defaultTemplateId
      defaultPaperSize
      defaultLocale
      defaultColorProfile
      defaultImageQuality
      ligaturesEnabled
    }
  }
}
