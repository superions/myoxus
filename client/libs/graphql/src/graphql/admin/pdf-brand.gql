query adminDocumentBrandingProfile($workspaceId: ID!) {
  admin {
    documentBrandingProfile(workspaceId: $workspaceId) {
      workspaceId
      logoLargeBlob
      logoSmallBlob
      footerText
      colorPolicy
      colorPaletteKey
      brandColorPrimary
      brandColorAccent
      brandColorRule
      brandColorText
      brandColorBackground
      updatedAt
      updatedBy
    }
  }
}

query adminDocumentBrandColorPalettes($workspaceId: ID!) {
  admin {
    documentBrandColorPalettes(workspaceId: $workspaceId) {
      themeSlug
      themeName
      paletteKey
      name
      primaryColor
      accentColor
      ruleColor
      textColor
      backgroundColor
      isDefault
    }
  }
}

query adminPdfExportSettings($workspaceId: ID!) {
  admin {
    pdfExportSettings(workspaceId: $workspaceId) {
      workspaceId
      defaultTemplateId
      defaultPaperSize
      defaultLocale
      defaultColorProfile
      defaultImageQuality
      ligaturesEnabled
    }
  }
}

mutation adminUploadDocumentBrandLogo(
  $workspaceId: ID!
  $kind: BrandLogoKind!
  $file: Upload!
) {
  admin {
    uploadDocumentBrandLogo(workspaceId: $workspaceId, kind: $kind, file: $file) {
      workspaceId
      logoLargeBlob
      logoSmallBlob
      footerText
      colorPolicy
      colorPaletteKey
      brandColorPrimary
      brandColorAccent
      brandColorRule
      brandColorText
      brandColorBackground
      updatedAt
      updatedBy
    }
  }
}

mutation adminDeleteDocumentBrandLogo($workspaceId: ID!, $kind: BrandLogoKind!) {
  admin {
    deleteDocumentBrandLogo(workspaceId: $workspaceId, kind: $kind) {
      workspaceId
      logoLargeBlob
      logoSmallBlob
      footerText
      colorPolicy
      colorPaletteKey
      brandColorPrimary
      brandColorAccent
      brandColorRule
