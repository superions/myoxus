query adminWorkspace(
  $id: String!
  $memberSkip: Int
  $memberTake: Int
  $memberQuery: String
) {
  admin {
    adminWorkspace(id: $id) {
      id
      public
      createdAt
      name
      avatarKey
      isPersonal
      workspaceType
      ownerPrincipalType
      ownerPrincipalId
      ownerPrincipalName
      enableAi
      enableSharing
      enableUrlPreview
      enableDocEmbedding
      features
      owner {
        id
        name
        email
        avatarUrl
      }
      memberCount
      publicPageCount
      snapshotCount
      snapshotSize
      blobCount
      blobSize
      storageQuotaBytes
      storageQuotaUsed
      sharedLinks {
        workspaceId
        docId
        title
        publicMode
        status
        shareUrl
        publishedAt
      }
      members(skip: $memberSkip, take: $memberTake, query: $memberQuery) {
        id
        name
        email
        avatarUrl
        role
        status
      }
    }
  }
}
