query adminConfigValues {
  admin {
    adminConfigValues {
      revision
      modules {
        module
        groups {
          fields {
            path
            value
          }
        }
      }
      effectiveFields {
        path
        runtimeEffectiveValue
        winningSource
        runtimeEffectiveState
        requiresRestart
        sensitive
      }
    }
  }
}
