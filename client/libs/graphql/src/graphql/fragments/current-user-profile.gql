fragment CurrentUserProfile on UserType {
  id
  name
  email
  avatarUrl
  emailVerified
  features
  preferences {
    updatedAt
    values {
      locale
      defaultDocumentLanguage
      timezone
      dateFormat
      timeFormat
      receiveInvitationEmail
      receiveMentionEmail
      receiveCommentEmail
      journalFirstDayOfWeek
      journalShowCalendarWeeks
      colorMode
      showLinkedDocuments
      imageAntialiasing
      noisyBackground
      editorFontFamily
      editorCustomFontFamily
      editorFontSize
      newDocumentMode
      fullWidthLayout
      openDocumentMode
      edgelessDefaultTheme
      telemetryEnabled
      aiModelId
      aiReasoningEnabled
      documentMetadataHeaderVisibility {
        workspaceId
        fields { field visible }
      }
    }
    effectiveValues {
      locale
      defaultDocumentLanguage
      timezone
      dateFormat
      timeFormat
      receiveInvitationEmail
      receiveMentionEmail
      receiveCommentEmail
      journalFirstDayOfWeek
      journalShowCalendarWeeks
      colorMode
      showLinkedDocuments
      imageAntialiasing
      noisyBackground
      editorFontFamily
      editorCustomFontFamily
      editorFontSize
      newDocumentMode
      fullWidthLayout
      openDocumentMode
      edgelessDefaultTheme
      telemetryEnabled
      aiModelId
      aiReasoningEnabled
      documentMetadataHeaderVisibility {
        workspaceId
        fields { field visible }
      }
    }
  }
  quota {
    name
    blobLimit
    storageQuota
    historyPeriod
    memberLimit
    humanReadable {
      name
      blobLimit
      storageQuota
      historyPeriod
      memberLimit
    }
  }
  quotaUsage {
    storageQuota
  }
  copilot {
    quota {
      limit
      used
    }
  }
}
