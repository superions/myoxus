#import './fragments/password-limits.gql'
#import './fragments/credentials-requirement.gql'

query serverConfig {
  serverConfig {
    version
    baseUrl
    name
    features
    type
    deploymentType
    initialized
    calendarProviders
    credentialsRequirement {
      ...CredentialsRequirements
    }
    client {
      downloadUrl
      clipboardHttpFallback
    }
    transcription {
      enabled
      configured
      status
      maxInputBytes
      maxDurationSeconds
    }
    preview {
      maxConcurrentRequests
      requestTimeoutMs
      retryCount
    }
    i18n {
      availableLocales
      defaultLocale
    }
  }
}
