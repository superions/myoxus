query matchWorkspaceDocs($contextId: String, $workspaceId: String, $content: String!, $limit: Int, $scopedThreshold: Float, $threshold: Float) {
  currentUser {
    copilot(workspaceId: $workspaceId) {
      contexts(contextId: $contextId) {
        matchWorkspaceDocs(content: $content, limit: $limit, scopedThreshold: $scopedThreshold, threshold: $threshold) {
          docId
          chunk
          content
          distance
        }
      }
    }
  }
}