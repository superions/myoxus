mutation deleteDocumentPermanently($input: DeleteDocumentPermanentlyInput!) {
  deleteDocumentPermanently(input: $input) {
    requested
    deleted
    notFound
    forbidden
    alreadyDeleted
    notTrashed
    failed
    rootMetaRemoved
    documents {
      clientDocId
      resolvedDocId
      title
      status
      reason
    }
  }
}
