query databases(
  $workspaceId: String!
  $first: Int
  $offset: Int
  $search: String
  $profileKind: DatabaseProfileKind
  $databaseIds: [ID!]
  $sort: DatabaseInventorySort
) {
  workspace(id: $workspaceId) {
    databases(
      first: $first
      offset: $offset
      search: $search
      profileKind: $profileKind
      databaseIds: $databaseIds
      sort: $sort
    ) {
      ...DatabaseSummary
    }
  }
}

query databaseSearch(
  $workspaceId: String!
  $filter: DatabaseSearchFilterInput!
) {
  workspace(id: $workspaceId) {
    databaseSearch(filter: $filter) {
      rowId
      databaseId
      title
      snippet
      hasContentDocument
      updatedAt
    }
  }
}

