query databaseEffectiveViewState($workspaceId: String!, $databaseId: ID!, $viewId: ID!) {
  workspace(id: $workspaceId) {
    databaseEffectiveViewState(databaseId: $databaseId, viewId: $viewId) {
      viewId
      savedSort {
        ...DatabaseSortRule
      }
      savedFilterTree {
        ...DatabaseFilterGroup
      }
      personalState {
        viewId
        searchText
        sort {
          ...DatabaseSortRule
        }
        filterTree {
          ...DatabaseFilterGroup
        }
        fieldWidthOverrides {
          fieldId
          width
        }
        collapsedGroupKeys
        editRevision
        updatedAt
      }
      effectiveSort {
        ...DatabaseSortRule
      }
      effectiveFilterTree {
        ...DatabaseFilterGroup
      }
      searchText
      effectiveFieldWidths {
        fieldId
        width
      }
      canEditShared
      canEditRows
    }
  }
}

query databaseRows(
  $workspaceId: String!
  $databaseId: ID!
  $first: Int
  $offset: Int
  $after: String
  $viewId: ID
  $search: String
  $sort: [DatabaseSortRuleInput!]
  $filter: [DatabaseFilterRuleInput!]
  $filterTree: DatabaseFilterGroupInput
  $scheduleWindow: DatabaseScheduleWindowInput
) {
  workspace(id: $workspaceId) {
    databaseRows(
      databaseId: $databaseId
      first: $first
      offset: $offset
      after: $after
      viewId: $viewId
      search: $search
      sort: $sort
      filter: $filter
      filterTree: $filterTree
      scheduleWindow: $scheduleWindow
    ) {
      totalCount
      endCursor
      rows {
        ...DatabaseRowRecord
      }
    }
  }
}

query databaseRow(
  $workspaceId: String!
  $databaseId: ID!
  $rowId: ID!
  $includeTrashed: Boolean = false
) {
  workspace(id: $workspaceId) {
    databaseRow(databaseId: $databaseId, rowId: $rowId, includeTrashed: $includeTrashed) {
      ...DatabaseRowRecord
    }
  }
}

query databaseTaskParent(
  $workspaceId: String!
  $databaseId: ID!
  $rowId: ID!
) {
  workspace(id: $workspaceId) {
    id
    databaseRow(databaseId: $databaseId, rowId: $rowId, includeTrashed: true) {
      row {
        id
        databaseId
        taskParent {
          available
          fieldId
          parentRowIds
          diagnostics
        }
      }
    }
  }
}

query databaseTaskBlockedBy(
  $workspaceId: String!
  $databaseId: ID!
  $rowId: ID!
  $after: String
) {
  workspace(id: $workspaceId) {
    id
    databaseRow(databaseId: $databaseId, rowId: $rowId, includeTrashed: true) {
      row {
        id
        databaseId
        taskBlockedBy(first: 50, after: $after) {
          available
          fieldId
          diagnostics
          retainedRowIds
          rows { rowId state task { ...DatabaseTaskSummary } }
          nextCursor
        }
      }
    }
  }
}

query databaseTaskBlocks(
  $workspaceId: String!
  $databaseId: ID!
  $rowId: ID!
  $after: String
) {
  workspace(id: $workspaceId) {
    id
    databaseRow(databaseId: $databaseId, rowId: $rowId, includeTrashed: true) {
      row {
        id
        databaseId
        taskBlocks(first: 20, after: $after) {
          available
          fieldId
          diagnostics
          rows {
            rowId
            state
            task {
              ...DatabaseTaskSummary
            }
          }
          nextCursor
        }
      }
    }
  }
}

query databaseTaskChildren(
  $workspaceId: String!
  $databaseId: ID!
  $rowId: ID!
  $first: Int
  $after: String
) {
  workspace(id: $workspaceId) {
    id
    databaseRow(databaseId: $databaseId, rowId: $rowId, includeTrashed: true) {
      row {
        id
        databaseId
        taskChildren(first: $first, after: $after) {
          available
          fieldId
          diagnostics
          rows { ...DatabaseTaskSummary }
          totalCount
          completeCount
          archivedCount
          nextCursor
        }
      }
    }
  }
}

query databaseRowReminders(
  $workspaceId: String!
  $databaseId: ID!
  $rowId: ID!
  $fieldId: ID!
