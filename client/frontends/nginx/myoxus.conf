map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream myoxus_api {
  zone myoxus_api 64k;
  server api:3001 resolve;
}

# Query strings and Referer can carry OAuth codes/state or reset tokens.
# Keep routing/status diagnostics without copying bearer credentials to logs.
# $uri changes during SPA fallback; derive the original path before logging.
map $request_uri $myoxus_request_path {
  ~^([^?]*) $1;
}

log_format myoxus_main '$remote_addr - $remote_user [$time_local] "$request_method $myoxus_request_path $server_protocol" '
                       '$status $body_bytes_sent '
                       '"$http_user_agent" req_id=$request_id '
                       'upstream_status=$upstream_status '
                       'rt=$request_time urt=$upstream_response_time';

server {
  listen 3010;
  server_name _;

  # Preserve standard asset types and serve PDF.js module workers as JavaScript.
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }

  # Nginx appends raw request/upstream URLs and Referer to request errors,
  # regardless of log_format. Use the redacted access log for request failures;
  # global startup/configuration diagnostics retain the default error log.
  error_log /dev/null;
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  access_log /var/log/nginx/access.log myoxus_main;
  client_max_body_size 25m;
  root /usr/share/nginx/frontends/web;
  index selfhost.html index.html;

  location = /health {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  # Preserve gateway liveness at /health; readiness belongs to the API process.
  location = /ready {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://myoxus_api/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /admin { return 302 /adminfrontend/; }
  location = /admin/index.html { return 302 /adminfrontend/; }
  location = /adminfrontend { return 302 /adminfrontend/; }
  location = /adminfrontend/index.html { return 302 /adminfrontend/; }
  location = /adminfrontend/accounts { return 308 /adminfrontend/organization?tab=members; }
  location = /adminfrontend/about { return 308 /adminfrontend/system; }
  location = /adminfrontend/orphaned-workspaces { return 308 /adminfrontend/storage?tab=orphaned; }
  location = /adminfrontend/logging { return 308 /adminfrontend/system?tab=logging; }

  location ~* ^/(billing|pricing|upgrade|subscription|subscriptions|seat|seats|license|licenses|checkout|portal)(/|$) {
    return 302 /;
  }

  location ~* ^/admin/(billing|pricing|upgrade|subscription|subscriptions|seat|seats|license|licenses|checkout|portal)(/|$) {
    return 302 /adminfrontend/;
  }

  location ~* ^/adminfrontend/(billing|pricing|upgrade|subscription|subscriptions|seat|seats|license|licenses|checkout|portal)(/|$) {
    return 302 /adminfrontend/;
  }

  location = /mcp {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /graphql {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /info {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api/info;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ^~ /api/fonts/ {
    root /usr/share/nginx/frontends;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/copilot/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location /api/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ^~ /public/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Public publishing HTML is owned by the API renderer. Keep it ahead of the
    # Web SPA fallback so canonical `/public/{workspace_id}/{doc_id}` URLs work
    # on the same origin that Web copies into share controls.
    proxy_pass http://myoxus_api;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ^~ /public-assets/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location ^~ /share/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  location = /socket.io {
    return 301 /socket.io/$is_args$args;
  }

  location /socket.io/ {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://myoxus_api/socket.io/;
    proxy_http_version 1.1;
    proxy_read_timeout @MYOXUS_SOCKET_IO_PROXY_READ_TIMEOUT_SECONDS@s;
    proxy_send_timeout @MYOXUS_SOCKET_IO_PROXY_SEND_TIMEOUT_SECONDS@s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
  }

  # Canonical identity assets are deliberately outside the runtime theme mount.
  # Exact locations preserve the public `/style/*` contract while avoiding a
  # nested bind mount beneath the read-only style directory.
  location = /style/logo.svg {
    alias /usr/share/nginx/frontends/canonical-style/logo.svg;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
  }

  location = /style/product-mark.svg {
    alias /usr/share/nginx/frontends/canonical-style/product-mark.svg;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300";
  }

  location ^~ /style/ {
    root /usr/share/nginx/frontends;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location ^~ /qa/ {
    root /usr/share/nginx;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location @myoxus_admin_spa {
    root /usr/share/nginx/frontends/admin;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store";
    try_files /selfhost.html =404;
  }

  location @myoxus_web_spa {
    root /usr/share/nginx/frontends/web;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store";
    try_files /selfhost.html =404;
  }

  location /admin/ {
    rewrite ^/admin/(.*)$ /adminfrontend/$1 permanent;
  }

  location = /adminfrontend/ {
    root /usr/share/nginx/frontends/admin;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store";
    try_files /selfhost.html =404;
  }

  location /adminfrontend/ {
    location ~* "\.[0-9a-f]{8,}\.(?:avif|br|cjs|css|gif|gz|ico|jpe?g|js|mjs|mp4|otf|pdf|png|svg|ttf|wasm|webm|webp|woff2?|zip)$" {
      rewrite ^/adminfrontend/(.*)$ /$1 break;
      root /usr/share/nginx/frontends/admin;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location ~* \.(?:avif|br|cjs|css|gif|gz|html|ico|jpe?g|js|json|map|mjs|mp4|otf|pdf|png|svg|ttf|txt|wasm|webmanifest|webm|webp|woff2?|xml|zip)$ {
      rewrite ^/adminfrontend/(.*)$ /$1 break;
      root /usr/share/nginx/frontends/admin;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    rewrite ^/adminfrontend/(.*)$ /$1 break;
    root /usr/share/nginx/frontends/admin;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store";
    try_files $uri @myoxus_admin_spa;
  }

  location ~ ^/workspace/.+ {
    add_header Set-Cookie "myoxus_redirect=$request_uri; Path=/; Max-Age=300; SameSite=Lax" always;
    return 302 /;
  }

  location / {
    location ~* "\.[0-9a-f]{8,}\.(?:avif|br|cjs|css|gif|gz|ico|jpe?g|js|mjs|mp4|otf|pdf|png|svg|ttf|wasm|webm|webp|woff2?|zip)$" {
      root /usr/share/nginx/frontends/web;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location ~* \.(?:avif|br|cjs|css|gif|gz|html|ico|jpe?g|js|json|map|mjs|mp4|otf|pdf|png|svg|ttf|txt|wasm|webmanifest|webm|webp|woff2?|xml|zip)$ {
      root /usr/share/nginx/frontends/web;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ @myoxus_web_spa;
  }

  include /etc/nginx/basepath-extra.conf;
}
