worker_processes 1;

events {
  worker_connections 128;
}

# Test-only two-node load balancer. A single Nginx worker makes the short
# round-robin assertion deterministic on hosts with large CPU counts. Ordinary
# requests are distributed; only Engine.IO polling keeps transport affinity.
http {
  upstream myoxus_http {
    server api-1:3001;
    server api-2:3001;
    keepalive 8;
  }

  upstream myoxus_socket {
    ip_hash;
    server api-1:3001;
    server api-2:3001;
  }

  server {
    listen 8080;
    server_name _;

    location /socket.io {
      proxy_pass http://myoxus_socket;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      add_header X-Myoxus-Test-Upstream $upstream_addr always;
    }

    location / {
      proxy_pass http://myoxus_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      add_header X-Myoxus-Test-Upstream $upstream_addr always;
    }
  }
}
