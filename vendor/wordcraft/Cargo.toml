[workspace]
resolver = "3"
members = ["crates/geom", "crates/doc", "crates/docx"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"

[workspace.dependencies]
wordcraft-geom = { path = "crates/geom" }
wordcraft-doc = { path = "crates/doc" }
quick-xml = "0.41"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
unicode-bidi = "0.3"
unicode-segmentation = "1"
cfb = "0.15"
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = "0.3"
zeroize = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"
