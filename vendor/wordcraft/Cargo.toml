[workspace]
resolver = "3"
members = ["crates/geom", "crates/doc", "crates/docx"]
exclude = ["craft-libs"]

[workspace.package]
version = "0.19.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"

[workspace.dependencies]
wordcraft-geom = { path = "crates/geom" }
wordcraft-doc = { path = "crates/doc" }
craft-codepage = { path = "craft-libs/crates/codepage" }
craft-docx = { path = "craft-libs/crates/docx" }
craft-wordmodel = { path = "craft-libs/crates/wordmodel" }
craft-xml = { path = "craft-libs/crates/xml" }
craft-zip = { path = "craft-libs/crates/zip" }

base64 = "0.23"
cfb = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
unicode-segmentation = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2
debug = 0
