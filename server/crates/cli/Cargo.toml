[package]
description       = "Admin CLI for the Myoxus server"
edition.workspace = true
license.workspace = true
name              = "myoxus-cli"
version.workspace = true

[[bin]]
name = "myoxus-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace             = true
async-trait.workspace        = true
base64.workspace             = true
bytes.workspace              = true
chrono.workspace             = true
clap.workspace               = true
rand.workspace               = true
reqwest                      = { workspace = true, features = ["json"] }
rpassword.workspace          = true
serde.workspace              = true
serde_json.workspace         = true
sha2.workspace               = true
sqlx.workspace               = true
tabled.workspace             = true
tempfile                     = "3"
tokio.workspace              = true
tracing.workspace            = true
tracing-subscriber.workspace = true
uuid.workspace               = true

myoxus-api              = { path = "../api" }
myoxus-application      = { path = "../application" }
myoxus-contracts        = { path = "../contracts" }
myoxus-domain           = { path = "../domain" }
myoxus-infrastructure   = { path = "../infrastructure" }
myoxus-public-render    = { path = "../public_render" }
myoxus-worker           = { path = "../worker" }
myoxus-workspace-import = { path = "../workspace_import" }
yjs                     = { path = "../yjs" }

[dev-dependencies]
yrs = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
