[package]
edition.workspace = true
license.workspace = true
name              = "myoxus-application"
version.workspace = true

[dependencies]
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true
csv.workspace = true
dashmap.workspace = true
fixed_decimal = "=0.7.2"
futures-util.workspace = true
hex.workspace = true
hickory-resolver.workspace = true
hmac.workspace = true
icu_datetime = { version = "=2.2.0", default-features = false, features = [
  "compiled_data",
] }
icu_decimal = "=2.2.0"
icu_locale = "=2.2.0"
image.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
scraper.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
url = "2"
urlencoding.workspace = true
uuid.workspace = true
yaml_serde.workspace = true
zip.workspace = true
# P-DB-29: Notion HTML import pipeline uses a streaming, no-allocation
# XML parser; the doc_pipeline crate has `quick-xml` already under its
# `docx` feature, but the Notion path is enabled unconditionally so
# preview/apply work in every binary that depends on `myoxus-application`.
quick-xml.workspace = true

infer.workspace      = true
mime.workspace       = true
mime_guess.workspace = true
moka.workspace       = true
nom.workspace        = true

# P-Captcha-B: ALTCHA proof-of-work challenge creation + verification.
# Pinned to 0.3.2 — v0.3.3 has an incompatible digest-version upgrade.
altcha-lib-rs = { version = "0.3.2", features = ["json"] }

# P-PDF-TPL-COLOR-01: ICC profile validation. Spec originally listed lcms2 = "6"
# but that crate is not available offline. moxcms is a pure-Rust ICC parser with
# an equivalent API (ColorProfile::new_from_slice, DataColorSpace, ProfileClass).
moxcms = "0.8"

# P-PDF-TPL-FONT-01: server-side font validation + license auto-detection.
# `ttf-parser` reads OS/2 + name tables from TTF/OTF SFNT bytes.
# Uploaded WOFF2 fonts are rejected rather than decompressed by this validator.
ttf-parser.workspace = true

# P-PDF-TPL-09-08: SVG sanitization for brand-logo uploads.
usvg.workspace = true

myoxus-contracts = { path = "../contracts" }
myoxus-doc-pipeline = { path = "../doc_pipeline", default-features = false, features = [
  "splitting",
] }
myoxus-domain = { path = "../domain" }
myoxus-pdf-export = { path = "../pdf_export" }
myoxus-public-render = { path = "../public_render" }
myoxus-workspace-import = { path = "../workspace_import" }
yjs = { path = "../yjs" }
yrs = { workspace = true }

[dev-dependencies]
tempfile.workspace           = true
tokio                        = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
