                  timeZone: UTC
          key: Customer story draft
          relation_cells: []
          row_kind: record
          title: Customer story draft
        - cells:
            - - status
              - kind: status
                value: status.todo
            - - channel
              - kind: multi_select
                value:
                  - social
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-20T08:00:00Z"
                  timeZone: UTC
          key: Weekly product tip
          relation_cells: []
          row_kind: record
          title: Weekly product tip
        - cells:
            - - status
              - kind: status
                value: status.done
            - - channel
              - kind: multi_select
                value:
                  - email
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-11T15:00:00Z"
                  timeZone: UTC
          key: Newsletter intro
          relation_cells: []
          row_kind: record
          title: Newsletter intro
        - cells:
            - - status
              - kind: status
                value: status.todo
            - - channel
              - kind: multi_select
                value:
                  - social
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-22T10:00:00Z"
                  timeZone: UTC
          key: Launch recap
          relation_cells: []
          row_kind: record
          title: Launch recap
      views:
        - config:
            Calendar:
              date: publish
              visible:
                - title
                - status
                - owner
                - channel
          kind: calendar
          name: Calendar
        - config:
            Table:
              group: status
              visible:
                - title
                - status
                - publish
                - owner
                - channel
                - tags
          kind: table
          name: Table
