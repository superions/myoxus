format_version: 1
id: myoxus.database.content_calendar
version: 1.0.1
task_core: null
variants:
  - option_extensions: []
    field_order:
      - title
      - status
      - owner
      - publish
      - channel
      - tags
      - assets
    role_order: []
    priority: threeStep
    complexity: threeStep
    structure: tasks_only
    spec:
      category: database
      complexity_preset: null
      default_structure: null
      description: Plan publish dates, channels, owners, attachments and workflow status.
      fields:
        - config:
            Direct:
              kind: title
          field_type: title
          key: title
          name: Content item
          required: true
        - config:
            Direct:
              defaultOptionId: status.todo
              kind: status
              options:
                - colorRole: database.status.todo
                  group: notStarted
                  id: status.todo
                  name: Todo
                  position: 0
                - colorRole: database.status.inProgress
                  group: active
                  id: status.in_progress
                  name: In progress
                  position: 1
                - colorRole: database.status.done
                  group: complete
                  id: status.done
                  name: Done
                  position: 2
          field_type: status
          key: status
          name: Status
          required: true
        - config:
            Direct:
              kind: user
          field_type: user
          key: owner
          name: Owner
          required: false
        - config:
            Direct:
              allowReminders: true
              defaultTimeZone: null
              kind: date_time
          field_type: date_time
          key: publish
          name: Publish date
          required: false
        - config:
            Direct:
              kind: multi_select
              options:
                - colorRole: database.option.blog
                  id: blog
                  name: Blog
                  position: 0
                - colorRole: database.option.social
                  id: social
                  name: Social
                  position: 1
                - colorRole: database.option.email
                  id: email
                  name: Email
                  position: 2
          field_type: multi_select
          key: channel
          name: Channel
          required: false
        - config:
            Direct:
              kind: tags
              maxCount: null
          field_type: tags
          key: tags
          name: Tags
          required: false
        - config:
            Direct:
              allowedMimeCategories:
                - any
              kind: files
              maxItemCount: null
              maxItemSize: null
              previewPolicy: auto
          field_type: files
          key: assets
          name: Assets
          required: false
      id: myoxus.database.content_calendar
      name: Content Calendar
      priority_preset: null
      profile_kind: generic
      roles: []
      row_templates:
        - description: Start a publishable content item with draft status.
          initial_cells:
            - - status
              - kind: status
                value: status.todo
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-21T09:00:00Z"
                  timeZone: UTC
            - - channel
              - kind: multi_select
                value:
                  - blog
          is_default: true
          key: content-item
          name: Content item
          row_kind: record
      sample_rows:
        - cells:
            - - status
              - kind: status
                value: status.todo
            - - channel
              - kind: multi_select
                value:
                  - blog
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-14T09:00:00Z"
                  timeZone: UTC
          key: Release announcement
          relation_cells: []
          row_kind: record
          title: Release announcement
        - cells:
            - - status
              - kind: status
                value: status.in_progress
            - - channel
              - kind: multi_select
                value:
                  - blog
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-17T12:00:00Z"
                  timeZone: UTC
          key: Customer story draft
          relation_cells: []
          row_kind: record
          title: Customer story draft
        - cells:
            - - status
              - kind: status
                value: status.todo
            - - channel
              - kind: multi_select
                value:
                  - social
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-20T08:00:00Z"
                  timeZone: UTC
          key: Weekly product tip
          relation_cells: []
          row_kind: record
          title: Weekly product tip
        - cells:
            - - status
              - kind: status
                value: status.done
            - - channel
              - kind: multi_select
                value:
                  - email
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-11T15:00:00Z"
                  timeZone: UTC
          key: Newsletter intro
          relation_cells: []
          row_kind: record
          title: Newsletter intro
        - cells:
            - - status
              - kind: status
                value: status.todo
            - - channel
              - kind: multi_select
                value:
                  - social
            - - publish
              - kind: date_time
                value:
                  allDay: false
                  end: null
                  start: "2026-07-22T10:00:00Z"
                  timeZone: UTC
          key: Launch recap
          relation_cells: []
          row_kind: record
          title: Launch recap
      views:
        - config:
            Calendar:
              date: publish
              visible:
                - title
                - status
                - owner
                - channel
          kind: calendar
          name: Calendar
        - config:
            Table:
              group: status
              visible:
                - title
                - status
                - publish
                - owner
                - channel
                - tags
          kind: table
          name: Table
      metadata:
        name_key: com.myoxus.database.starter-template.database-content-calendar.name
        description_key: com.myoxus.database.starter-template.database-content-calendar.description
        fields:
          - key: title
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.title.name
            import_export_behavior: read_write
          - key: status
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.status.name
            import_export_behavior: read_write
          - key: owner
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.owner.name
            import_export_behavior: read_write
          - key: publish
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.publish.name
            import_export_behavior: read_write
          - key: channel
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.channel.name
            import_export_behavior: read_write
          - key: tags
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.tags.name
            import_export_behavior: read_write
          - key: assets
            name_key: com.myoxus.database.starter-template.database-content-calendar.field.assets.name
            import_export_behavior: read_write
        views:
          - key: calendar
            name_key: com.myoxus.database.starter-template.database-content-calendar.view.calendar.name
          - key: table
            name_key: com.myoxus.database.starter-template.database-content-calendar.view.table.name
        row_templates:
          - key: content-item
            name_key: com.myoxus.database.starter-template.database-content-calendar.row-template.content-item.name
            description_key: com.myoxus.database.starter-template.database-content-calendar.row-template.content-item.description
        sample_rows:
          - key: sample-1
            title_key: com.myoxus.database.starter-template.database-content-calendar.sample-row.sample-1.title
          - key: sample-2
            title_key: com.myoxus.database.starter-template.database-content-calendar.sample-row.sample-2.title
          - key: sample-3
            title_key: com.myoxus.database.starter-template.database-content-calendar.sample-row.sample-3.title
          - key: sample-4
            title_key: com.myoxus.database.starter-template.database-content-calendar.sample-row.sample-4.title
          - key: sample-5
            title_key: com.myoxus.database.starter-template.database-content-calendar.sample-row.sample-5.title
        import_mappings:
          - columnMappings:
              - fieldKey: title
                required: true
                sourceHeader: Content item
              - fieldKey: status
                required: true
                sourceHeader: Status
              - fieldKey: owner
                required: false
                sourceHeader: Owner
              - fieldKey: publish
                required: false
                sourceHeader: Publish date
              - fieldKey: channel
                required: false
                sourceHeader: Channel
              - fieldKey: tags
                required: false
                sourceHeader: Tags
              - fieldKey: assets
                required: false
                sourceHeader: Assets
            key: default-csv
            nameKey: com.myoxus.database.starter-template.database-content-calendar.import-mapping.default-csv.name
supported_predecessors:
  - 1.0.0
