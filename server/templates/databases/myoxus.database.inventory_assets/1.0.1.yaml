format_version: 1
id: myoxus.database.inventory_assets
version: 1.0.1
task_core: null
variants:
  - option_extensions: []
    field_order:
      - title
      - files
      - cost
      - tags
      - owner
      - location
      - status
    role_order: []
    priority: threeStep
    complexity: threeStep
    structure: tasks_only
    spec:
      category: database
      complexity_preset: null
      default_structure: null
      description: Manage assets with status, owner, location, cost, tags and gallery-ready files.
      fields:
        - config:
            Direct:
              kind: title
          field_type: title
          key: title
          name: Asset
          required: true
        - config:
            Direct:
              allowedMimeCategories:
                - any
              kind: files
              maxItemCount: null
              maxItemSize: null
              previewPolicy: auto
          field_type: files
          key: files
          name: Files
          required: false
        - config:
            Direct:
              allowCurrencyOverride: true
              defaultCurrency: EUR
              kind: currency
              maxValue: null
              minValue: 0.0
          field_type: currency
          key: cost
          name: Cost
          required: false
        - config:
            Direct:
              kind: tags
              maxCount: null
          field_type: tags
          key: tags
          name: Tags
          required: false
        - config:
            Direct:
              kind: user
          field_type: user
          key: owner
          name: Owner
          required: false
        - config:
            Direct:
              kind: text
              multiline: false
          field_type: text
          key: location
          name: Location
          required: false
        - config:
            Direct:
              defaultOptionId: status.todo
              kind: status
              options:
                - colorRole: database.status.todo
                  group: notStarted
                  id: status.todo
                  name: Todo
                  position: 0
                - colorRole: database.status.inProgress
                  group: active
                  id: status.in_progress
                  name: In progress
                  position: 1
                - colorRole: database.status.done
                  group: complete
                  id: status.done
                  name: Done
                  position: 2
          field_type: status
          key: status
          name: Status
          required: true
      id: myoxus.database.inventory_assets
      name: Inventory / Assets
      priority_preset: null
      profile_kind: generic
      roles: []
      row_templates:
        - description: Start an asset record with active status and zero cost.
          initial_cells:
            - - status
              - kind: status
                value: status.todo
            - - cost
              - kind: currency
                value:
                  amount: 0.0
                  currencyCode: EUR
          is_default: true
          key: asset
          name: Asset
          row_kind: record
      sample_rows:
