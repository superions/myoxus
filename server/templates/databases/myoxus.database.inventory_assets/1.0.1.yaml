              cover: null
              group: status
              show_empty_cover: false
              visible:
                - title
                - status
                - cost
                - owner
                - location
          kind: gallery
          name: Gallery
        - config:
            Table:
              group: status
              visible:
                - title
                - status
                - cost
                - owner
                - location
                - tags
          kind: table
          name: Table
      metadata:
