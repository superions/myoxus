format_version: 1
id: myoxus.database.crm_contacts
version: 1.0.1
task_core: null
variants:
  - option_extensions: []
    field_order:
      - title
      - company
      - email
      - phone
      - website
      - status
      - follow_up
      - related_contacts
    role_order: []
    priority: threeStep
    complexity: threeStep
    structure: tasks_only
    spec:
      category: database
      complexity_preset: null
      default_structure: null
      description: Track contacts, companies, communication details, status and follow-up dates.
      fields:
        - config:
            Direct:
              kind: title
          field_type: title
          key: title
          name: Contact
          required: true
        - config:
            Direct:
              kind: text
              multiline: false
          field_type: text
          key: company
          name: Company
          required: false
        - config:
            Direct:
              kind: email
          field_type: email
          key: email
          name: Email
          required: false
        - config:
            Direct:
              kind: phone
          field_type: phone
          key: phone
          name: Phone
          required: false
        - config:
            Direct:
              kind: url
          field_type: url
          key: website
          name: Website
          required: false
        - config:
            Direct:
              defaultOptionId: status.new
              kind: status
              options:
                - colorRole: database.status.todo
                  group: notStarted
                  id: status.new
                  name: New
                  position: 0
                - colorRole: database.status.inProgress
                  group: active
                  id: status.contacted
                  name: Contacted
                  position: 1
                - colorRole: database.status.inProgress
                  group: active
                  id: status.qualified
                  name: Qualified
                  position: 2
                - colorRole: database.status.done
                  group: complete
                  id: status.customer
                  name: Customer
                  position: 3
          field_type: status
          key: status
          name: Status
          required: true
        - config:
            Direct:
              includeTime: false
              kind: date
          field_type: date
          key: follow_up
          name: Next follow-up
          required: false
        - config:
            SelfRelation:
              allow_multiple: true
              max_targets: null
          field_type: relation
          key: related_contacts
          name: Related contacts
          required: false
      id: myoxus.database.crm_contacts
      name: CRM / Contacts
      priority_preset: null
      profile_kind: generic
      roles: []
      row_templates:
        - description: Start a contact with open follow-up status.
          initial_cells:
            - - status
              - kind: status
                value: status.new
            - - follow_up
              - kind: date
                value:
                  end: null
                  start: "2026-07-21"
          is_default: true
          key: contact
          name: Contact
          row_kind: record
