            - - status
              - kind: status
                value: status.done
            - - notes
              - kind: rich_text
                value:
                  document:
                    content:
                      - content:
                          - text: Capture summary, decision impact and open questions.
                            type: text
                        type: paragraph
                    type: doc
                  plainText: Capture summary, decision impact and open questions.
          key: Export validation checklist
          relation_cells: []
          row_kind: record
          title: Export validation checklist
        - cells:
            - - source
              - kind: url
                value: https://example.com/accessibility
            - - status
              - kind: status
                value: status.todo
            - - notes
              - kind: rich_text
                value:
                  document:
                    content:
                      - content:
                          - text: Capture summary, decision impact and open questions.
                            type: text
                        type: paragraph
                    type: doc
                  plainText: Capture summary, decision impact and open questions.
          key: Accessibility heuristics
          relation_cells: []
