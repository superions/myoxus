              - kind: url
                value: https://example.com/logging
            - - status
              - kind: status
                value: status.in_progress
            - - notes
              - kind: rich_text
                value:
                  document:
                    content:
                      - content:
                          - text: Capture summary, decision impact and open questions.
                            type: text
                        type: paragraph
                    type: doc
                  plainText: Capture summary, decision impact and open questions.
          key: Operational logging patterns
          relation_cells: []
          row_kind: record
          title: Operational logging patterns
      views:
        - config:
            Table:
              group: status
              visible:
                - title
                - document
                - source
                - status
                - tags
                - notes
          kind: table
          name: Table
        - config:
            List:
              group: status
              visible:
                - title
                - document
                - source
                - status
                - notes
          kind: list
          name: List
