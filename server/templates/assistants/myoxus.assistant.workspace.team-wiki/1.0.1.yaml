formatVersion: 1
id: myoxus.assistant.workspace.team-wiki
version: 1.0.1
name: &a1
  en: Team Wiki
  de: Team-Wiki
  fr: Wiki d’équipe
  es: Wiki de equipo
description:
  en:
    Start a team entry point with editable procedures and decision records in an
    explicit folder. Inviting people and assigning Tasks remain separate
    deliberate actions.
  de: Beginne mit einem Teameinstieg, bearbeitbaren Abläufen und
    Entscheidungsprotokollen in einem ausdrücklich gewählten Ordner. Personen
    einzuladen und Aufgaben zuzuweisen bleiben separate bewusste Aktionen.
  fr:
    Créez un point d’entrée avec des procédures et décisions modifiables dans un
    dossier explicitement choisi. Inviter des personnes et attribuer des tâches
    restent des actions distinctes.
  es:
    Crea una entrada de equipo con procedimientos y decisiones editables en una
    carpeta elegida explícitamente. Invitar personas y asignar tareas siguen
    siendo acciones separadas.
contexts:
  - workspaceCreation
inputs:
  - id: folder
    target: folder
    label:
      en: Content folder
      de: Inhaltsordner
      fr: Dossier du contenu
      es: Carpeta de contenido
    description:
      en: Name the folder for this content in the new workspace.
      de: Benenne den Ordner für diese Inhalte im neuen Arbeitsbereich.
      fr: Nommez le dossier de ce contenu dans le nouvel espace.
      es: Nombra la carpeta para este contenido en el nuevo espacio.
    valueType: folder
    required: true
    default: null
    choices: []
    visibleWhen: null
  - id: include-home
    target: includeComponent
    label:
      en: Team Wiki home
      de: Team-Wiki-Start
      fr: Accueil du Wiki d’équipe
      es: Inicio del Wiki de equipo
    description: null
    valueType: boolean
    required: false
    default:
      kind: boolean
      value: true
    choices: []
    visibleWhen: null
  - id: include-procedure
    target: includeComponent
    label:
      en: Procedure
      de: Ablaufbeschreibung
      fr: Procédure
      es: Procedimiento
    description: null
    valueType: boolean
    required: false
    default:
      kind: boolean
      value: true
    choices: []
    visibleWhen: null
  - id: include-decision
    target: includeComponent
    label:
      en: Decision record
      de: Entscheidungsprotokoll
      fr: Compte rendu de décision
      es: Registro de decisión
    description: null
    valueType: boolean
    required: false
    default:
      kind: boolean
      value: true
    choices: []
    visibleWhen: null
components:
  - id: workspace
    action:
      kind: createWorkspace
      inputs: {}
  - id: home
    action:
      kind: createWorkingDocument
      selected:
        kind: input
        input: include-home
      folder:
        kind: input
        input: folder
      variables: {}
  - id: procedure
    action:
      kind: createWorkingDocument
      selected:
        kind: input
        input: include-procedure
      folder:
        kind: input
        input: folder
      variables: {}
  - id: decision
    action:
      kind: createWorkingDocument
      selected:
        kind: input
        input: include-decision
      folder:
        kind: input
        input: folder
      variables: {}
  - id: place-home
    action:
      kind: placeNativeLink
      target:
        kind: result
        component: home
        value: document
      folder:
        kind: input
        input: folder
  - id: place-procedure
    action:
      kind: placeNativeLink
      target:
        kind: result
        component: procedure
        value: document
      folder:
        kind: input
        input: folder
  - id: place-decision
    action:
      kind: placeNativeLink
      target:
        kind: result
        component: decision
        value: document
      folder:
        kind: input
        input: folder
presentation:
