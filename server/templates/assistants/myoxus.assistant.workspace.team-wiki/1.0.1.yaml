          visibleWhen: null
      actions:
        - id: back
          label:
            en: Back to editing
            de: Zurück zur Bearbeitung
            fr: Revenir à la modification
            es: Volver a editar
          action: back
          component: null
          targetStep: details
          dialog: null
          visibleWhen: null
        - id: create
          label:
