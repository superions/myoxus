    - id: choose
      title:
        en: Template
        de: Vorlage
        fr: Modèle
        es: Plantilla
      groups:
        - id: catalog
          title: null
          role: content
          controls:
            - kind: offeringSelection
              search: true
          visibleWhen: null
      actions:
        - id: choose-cancel
          label:
            en: Cancel
            de: Abbrechen
            fr: Annuler
            es: Cancelar
          action: cancel
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: choose-next
          label:
            en: Next
            de: Weiter
            fr: Suivant
            es: Siguiente
          action: next
          component: null
          targetStep: details
          dialog: null
          visibleWhen: null
        - id: choose-check
          label:
            en: Check status
            de: Status prüfen
            fr: Vérifier le statut
            es: Comprobar estado
          action: check
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: choose-close
