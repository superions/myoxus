formatVersion: 1
id: myoxus.assistant.taskDetail
version: 1.0.0
name:
  en: Task details
  de: Aufgabendetails
  fr: Détails de la tâche
  es: Detalles de la tarea
description:
  en: People with access to the selected destination can read this Task.
  de: Personen mit Zugriff auf das gewählte Ziel können diese Aufgabe lesen.
  fr: Les personnes ayant accès à la destination choisie peuvent lire cette tâche.
  es: Las personas con acceso al destino elegido pueden leer esta tarea.
contexts:
  - taskDetail
inputs: []
components: []
presentation:
  steps:
    - id: detail
      title:
        en: Task details
        de: Aufgabendetails
        fr: Détails de la tâche
        es: Detalles de la tarea
      groups:
        - id: title
          title: null
          role: content
          controls:
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.title
              presence: always
          visibleWhen: null
        - id: source
          title: null
          role: content
          controls:
            - kind: sourceOrigin
          visibleWhen: null
        - id: description
          title: null
          role: content
          controls:
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.description
              presence: always
          visibleWhen: null
        - id: workflow
          title:
            en: Workflow
            de: Workflow
            fr: Workflow
            es: Flujo de trabajo
          role: workflow
          controls:
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.status
              presence: always
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.priority
              presence: always
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.progress
