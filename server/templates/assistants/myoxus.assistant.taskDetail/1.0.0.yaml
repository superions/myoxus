            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.startDate
              presence: always
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.dueDate
              presence: always
            - kind: nativeCell
              binding:
                kind: role
                roleKey: task.tags
              presence: always
            - kind: reminder
              offsetsMinutes:
                - 0
                - 10
                - 30
                - 60
                - 1440
                - 10080
              defaultOffsetMinutes: 120
              allowCustomOffset: true
          visibleWhen: null
        - id: parent
          title: null
          role: content
          controls:
