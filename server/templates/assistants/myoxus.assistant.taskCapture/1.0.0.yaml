formatVersion: 1
id: myoxus.assistant.taskCapture
version: 1.0.0
name:
  en: Capture as Task
  de: Als Aufgabe erfassen
  fr: Créer une tâche à partir du texte
  es: Crear tarea a partir del texto
description:
  en: People with access to the selected destination can read this Task.
  de: Personen mit Zugriff auf das gewählte Ziel können diese Aufgabe lesen.
  fr: Les personnes ayant accès à la destination choisie peuvent lire cette tâche.
  es: Las personas con acceso al destino elegido pueden leer esta tarea.
contexts:
  - taskCapture
inputs:
  - id: destination
    target: destination
    label:
      en: Destination
      de: Ziel
      fr: Destination
      es: Destino
    description: null
    valueType: databaseDestination
    required: false
    default: null
    choices: []
    visibleWhen: null
  - id: title
    target: title
    label:
      en: Title
      de: Titel
      fr: Titre
      es: Título
    description: null
    valueType: text
    required: true
    default: null
    choices: []
    visibleWhen: null
  - id: copy-description
    target: copyDescription
    label:
      en: Copy selected text into the Task description
      de: Ausgewählten Text in die Aufgabenbeschreibung kopieren
      fr: Copier le texte sélectionné dans la description de la tâche
      es: Copiar el texto seleccionado en la descripción de la tarea
    description: null
    valueType: boolean
    required: false
    default:
      kind: boolean
      value: false
    choices: []
    visibleWhen: null
components: []
presentation:
  steps:
    - id: create
      title:
        en: Capture as Task
        de: Als Aufgabe erfassen
        fr: Créer une tâche à partir du texte
        es: Crear tarea a partir del texto
      groups:
        - id: task
          title: null
          role: content
          controls:
            - kind: input
              input: destination
              control: destination
            - kind: destinationAudience
            - kind: input
              input: title
              control: text
            - kind: sourceOrigin
            - kind: input
              input: copy-description
              control: toggle
          visibleWhen: null
      actions:
        - id: cancel
          action: cancel
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: apply
          action: captureTask
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: check
          action: check
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: close
          action: close
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
  dialogs: []
