            - kind: input
              input: destination
              control: destination
            - kind: input
              input: title
              control: text
            - kind: input
              input: deadline
              control: dateTime
          visibleWhen: null
      actions:
        - id: cancel
          label:
            en: Cancel
            de: Abbrechen
            fr: Annuler
            es: Cancelar
          action: cancel
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: prepare
          label:
