formatVersion: 1
id: myoxus.assistant.taskMovement
version: 1.1.0
name:
  en: Move to Project
  de: In Projekt verschieben
  fr: Déplacer vers un projet
  es: Mover a un proyecto
description:
  en: The same Task keeps its supported Task field values, source link and content link. The Project assigns new display IDs. People with access to the destination can read the Task title and copied description. Permissions for the original source and content documents remain unchanged. Review the included and required related Tasks before confirming.
  de: Dieselbe Aufgabe behält ihre unterstützten Aufgabenfeldwerte, den Quellenlink und den Inhaltslink. Das Projekt vergibt neue Anzeigenummern. Personen mit Zugriff auf das Ziel können den Aufgabentitel und die kopierte Beschreibung lesen. Die Berechtigungen für das ursprüngliche Quelldokument und das Inhaltsdokument bleiben unverändert. Prüfe vor dem Bestätigen die enthaltenen und zusätzlich erforderlichen Aufgaben.
  fr: La même tâche conserve les valeurs de ses champs de tâche pris en charge, son lien vers la source et son lien vers le contenu. Le projet attribue de nouveaux identifiants d’affichage. Les personnes ayant accès à la destination peuvent lire le titre et la description copiée de la tâche. Les autorisations des documents source et de contenu restent inchangées. Vérifiez les tâches incluses et les tâches liées requises avant de confirmer.
  es: La misma tarea conserva los valores de sus campos de tarea compatibles, su enlace al origen y su enlace al contenido. El proyecto asigna nuevos identificadores visibles. Las personas con acceso al destino pueden leer el título y la descripción copiada de la tarea. Los permisos de los documentos originales de origen y contenido no cambian. Revisa las tareas incluidas y las tareas relacionadas necesarias antes de confirmar.
