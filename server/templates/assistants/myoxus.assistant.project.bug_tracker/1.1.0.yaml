            - kind: projectReview
          visibleWhen: null
      actions:
        - id: back-setup
          action: back
          component: null
          targetStep: setup
          dialog: null
          visibleWhen: null
        - id: cancel-review
          action: cancel
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: apply-project
          action: createProject
          component: project
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: check-project
          action: check
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: close-project
          action: close
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
