          role: content
          controls:
            - kind: input
              input: people
              control: members
            - kind: input
              input: start-date
              control: date
            - kind: input
              input: end-date
              control: date
          visibleWhen: null
      actions:
        - id: back-choose
          action: back
          component: null
          targetStep: choose
          dialog: null
          visibleWhen: null
        - id: cancel-details
          action: cancel
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: next-setup
          action: next
          component: null
          targetStep: setup
          dialog: null
          visibleWhen: null
    - id: setup
      title:
        en: Setup
        de: Einrichtung
        fr: Configuration
        es: Configuración
      groups:
        - id: variant
          title: null
          role: content
          controls:
            - kind: input
              input: priority
              control: select
            - kind: input
              input: complexity
              control: select
            - kind: input
              input: structure
              control: radioCards
            - kind: input
              input: view
              control: select
          visibleWhen: null
        - id: scaffold
          title: null
          role: content
          controls:
            - kind: input
              input: scaffold
              control: toggle
          visibleWhen: null
        - id: samples
          title: null
          role: content
          controls:
            - kind: input
              input: samples
              control: toggle
            - kind: input
              input: currency
              control: text
          visibleWhen: null
        - id: documents
          title:
            en: Documents (optional)
            de: Dokumente (optional)
            fr: Documents (facultatif)
            es: Documentos (opcional)
          role: content
          controls:
            - kind: input
              input: include-brief
              control: toggle
            - kind: input
              input: include-focus
              control: toggle
            - kind: input
              input: include-agenda
              control: toggle
            - kind: input
              input: include-register
              control: toggle
          visibleWhen: null
      actions:
        - id: back-details
          action: back
          component: null
          targetStep: details
          dialog: null
          visibleWhen: null
        - id: cancel-setup
          action: cancel
          component: null
          targetStep: null
          dialog: null
          visibleWhen: null
        - id: next-review
          action: next
          component: null
          targetStep: review
          dialog: null
          visibleWhen: null
