  - id: artwork.document-review
    kind: artwork
    path: features/base/document-review.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: One existing document is reviewed by one person, then branches to handover or revision.
        de: Eine Person prüft ein bestehendes Dokument; danach folgt eine Übergabe oder Überarbeitung.
        fr: Une personne relit un document existant, puis le transmet ou demande une révision.
        es: Una persona revisa un documento existente y después lo entrega o solicita una revisión.
      caption:
        en: Review the original document. Approval hands work back; requested changes include the reviewer’s reason.
        de: Prüfe das Originaldokument. Eine Freigabe übergibt die Arbeit zurück; Änderungswünsche enthalten die Begründung der prüfenden Person.
        fr: Relisez le document d’origine. L’approbation transmet le travail ; une demande de modifications inclut le motif de la personne chargée de la relecture.
        es: Revisa el documento original. La aprobación devuelve el trabajo; los cambios solicitados incluyen el motivo de la persona revisora.
  - id: workflow.task-handover.1.0.0
    kind: workflow
    path: workflows/myoxus.workflow.handover_after_prerequisites/1.0.0.yaml
  - id: artwork.task-handover
    kind: artwork
    path: features/base/task-handover.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: Two prerequisite Tasks converge before a document-linked task is assigned to one person.
        de: Zwei vorausgesetzte Aufgaben laufen zusammen, bevor eine Aufgabe mit Dokument einer Person zugewiesen wird.
        fr: Deux tâches prérequises convergent avant qu’une tâche liée au document soit attribuée à une personne.
        es: Dos tareas previas convergen antes de asignar una tarea vinculada al documento a una persona.
      caption:
        en: Choose existing Tasks and a deadline. After every prerequisite completes, create one handover linked to the original document.
        de: Wähle bestehende Aufgaben und eine Frist. Nach Abschluss aller Voraussetzungen entsteht eine Übergabeaufgabe mit dem Originaldokument.
        fr: Choisissez des tâches existantes et une échéance. Une fois tous les prérequis terminés, créez une transmission liée au document d’origine.
        es: Elige tareas existentes y un plazo. Tras completar todos los requisitos previos, crea una entrega vinculada al documento original.
