  - id: artwork.project.simple-project
    kind: artwork
    path: features/artwork/simple-project.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: Three task groups with milestone markers and a completed task.
        de: Drei Aufgabengruppen mit Meilensteinmarkierungen und einer erledigten Aufgabe.
        fr: Trois groupes de tâches avec des repères de jalons et une tâche terminée.
        es: Tres grupos de tareas con marcadores de hitos y una tarea completada.
      caption:
        en: Group tasks into phases and milestones, or keep a task-only structure. Choose the structure and initial view below.
        de: Gruppiere Aufgaben in Phasen und Meilensteine oder verwende nur Aufgaben. Wähle unten die Struktur und die anfängliche Ansicht.
        fr: Regroupez les tâches en phases et jalons ou conservez uniquement des tâches. Choisissez la structure et la vue initiale ci-dessous.
        es: Agrupa las tareas en fases e hitos o utiliza solo tareas. Elige la estructura y la vista inicial a continuación.
  - id: artwork.project.product-roadmap
    kind: artwork
    path: features/artwork/product-roadmap.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: Three work streams on a timeline, each ending at a milestone.
        de: Drei Arbeitsstränge auf einer Zeitachse, die jeweils an einem Meilenstein enden.
        fr: Trois axes de travail sur une chronologie, chacun se terminant par un jalon.
        es: Tres líneas de trabajo en una cronología, cada una terminando en un hito.
      caption:
        en: Compare work and milestones over time. Choose the initial view and task options below.
        de: Vergleiche Aufgaben und Meilensteine im zeitlichen Verlauf. Wähle unten die anfängliche Ansicht und die Aufgabenoptionen.
        fr: Comparez les tâches et les jalons dans le temps. Choisissez la vue initiale et les options des tâches ci-dessous.
        es: Compara las tareas y los hitos a lo largo del tiempo. Elige la vista inicial y las opciones de las tareas a continuación.
  - id: artwork.project.bug-tracker
    kind: artwork
    path: features/artwork/bug-tracker.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: Issue cards move from a bug symbol through investigation to completed items.
        de: Fehlerkarten durchlaufen die Untersuchung bis zum Abschluss.
        fr: Des fiches de bogues passent de leur identification à leur résolution.
        es: Las tarjetas de errores pasan de la identificación a la investigación y la finalización.
      caption:
        en: Track issues from triage to completion. Choose the initial view and task options below.
        de: Verfolge Fehler von der ersten Prüfung bis zum Abschluss. Wähle unten die anfängliche Ansicht und die Aufgabenoptionen.
        fr: Suivez les bogues du triage à la résolution. Choisissez la vue initiale et les options des tâches ci-dessous.
        es: Sigue los errores desde su clasificación hasta su resolución. Elige la vista inicial y las opciones de las tareas a continuación.
