  - id: artwork.context.preparation
    kind: artwork
    path: features/artwork/context-preparation.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: A work container with an optional task points to a separate document containing editable notes and context links.
        de: Ein Arbeitscontainer mit optionaler Aufgabe verweist auf ein separates Dokument mit editierbaren Notizen und Kontextlinks.
        fr: Un conteneur de travail avec une tâche facultative mène à un document distinct contenant des notes modifiables et des liens contextuels.
        es: Un contenedor de trabajo con una tarea opcional apunta a un documento separado con notas editables y enlaces contextuales.
      caption:
        en: Prepare a separate editable copy with authorized context links. Choose any people and date explicitly; no task is assigned or changed.
        de: Bereite eine separate editierbare Kopie mit autorisierten Kontextlinks vor. Wähle Personen und Datum ausdrücklich; keine Aufgabe wird zugewiesen oder verändert.
        fr: Préparez une copie modifiable distincte avec des liens contextuels autorisés. Choisissez explicitement les personnes et la date ; aucune tâche n’est assignée ni modifiée.
        es: Prepara una copia editable separada con enlaces contextuales autorizados. Elige personas y fecha explícitamente; no se asigna ni cambia ninguna tarea.
