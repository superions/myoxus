  - id: artwork.task-maintenance
    kind: artwork
    path: features/base/maintenance.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: A Task is inspected, its proposed correction is reviewed, then accepted or declined.
        de: Eine Aufgabe wird geprüft; ihre vorgeschlagene Korrektur wird kontrolliert und bestätigt oder abgelehnt.
        fr: Une tâche est vérifiée ; sa correction proposée est examinée puis confirmée ou refusée.
        es: Se revisa una tarea; su corrección propuesta se examina y se confirma o rechaza.
      caption:
        en: Inspect current Task values. Review exact changes before confirming them; declining changes nothing.
        de: Prüfe aktuelle Aufgabenwerte. Kontrolliere genaue Änderungen vor der Bestätigung; Ablehnen ändert nichts.
        fr: Vérifiez les valeurs actuelles des tâches. Examinez les modifications exactes avant de les confirmer ; un refus ne change rien.
        es: Revisa los valores actuales de las tareas. Examina los cambios exactos antes de confirmarlos; rechazarlos no cambia nada.
  - id: workflow.task-content-preparation.1.0.0
