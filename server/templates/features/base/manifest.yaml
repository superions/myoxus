  - id: artwork.task-content-preparation
    kind: artwork
    path: features/base/task-content-preparation.svg
    artwork:
      mediaType: image/svg+xml
      width: 640
      height: 240
      alternative:
        en: A new Task receives content from a selected native source without replacing existing content.
        de: Eine neue Aufgabe erhält Inhalt aus einer gewählten nativen Quelle, ohne vorhandenen Inhalt zu ersetzen.
        fr: Une nouvelle tâche reçoit le contenu d’une source native sélectionnée sans remplacer le contenu existant.
        es: Una tarea nueva recibe contenido de una fuente nativa seleccionada sin reemplazar el contenido existente.
      caption:
        en: Personally review the source and literal inputs before enabling automatic preparation for your new Tasks.
        de: Prüfe Quelle und wörtliche Eingaben persönlich, bevor du die automatische Vorbereitung für deine neuen Aufgaben aktivierst.
        fr: Vérifiez personnellement la source et les saisies littérales avant d’activer la préparation automatique de vos nouvelles tâches.
        es: Revisa personalmente la fuente y las entradas literales antes de activar la preparación automática de tus nuevas tareas.
