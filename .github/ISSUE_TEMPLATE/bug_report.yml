name: Bug report
description: Report a reproducible problem in Myoxus.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private data, or security vulnerabilities.
        Security issues belong in [SECURITY.md](https://github.com/superions/myoxus/security/policy).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable set of steps or a minimal example.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Myoxus version
      placeholder: 0.41.5
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, deployment mode, browser, and relevant versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before posting.
      render: text
    validations:
      required: false
